<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Outer Shield Contour -->
  <path d="M32 10 L48 16 V30 C48 42.5 38.5 50.5 32 54 C25.5 50.5 16 42.5 16 30 V16 Z" fill="url(#shieldGrad)" />
  <path d="M32 13 L45 18 V29 C45 39.5 37 46.5 32 49.5 C27 46.5 19 39.5 19 29 V18 Z" fill="#0f172a" opacity="0.4" />

  <!-- Center Strategy Target & Compass Graphic -->
  <circle cx="32" cy="30" r="8" fill="none" stroke="url(#starGrad)" stroke-width="2" />
  <circle cx="32" cy="30" r="3" fill="url(#starGrad)" />
  
  <!-- Four Compass Rays -->
  <path d="M32 18 V22 M32 38 V42 M20 30 H24 M40 30 H44" stroke="url(#starGrad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
